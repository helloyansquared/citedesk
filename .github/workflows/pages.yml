name: Showcase

# Publishes showcase/ (the recorded-results page, built by scripts/build_showcase.py) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["showcase/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: showcase
      - id: deployment
        uses: actions/deploy-pages@v4
