name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (Python, n8n Code nodes, widget)
        run: pytest
      - name: Retrieval eval (keyword search only, no API key needed)
        env:
          CITEDESK_EMBED_BACKEND: none
        run: |
          citedesk ingest
          citedesk eval --retrieval-only
