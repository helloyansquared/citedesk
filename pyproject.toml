[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citedesk"
version = "0.1.0"
description = "A customer-support chatbot that answers from your documents, cites every source and hands off to a human when it isn't sure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "helloyansquared" }]
keywords = ["rag", "chatbot", "customer-support", "llm", "retrieval", "bm25", "embeddings", "n8n", "fastapi"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4.0", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
citedesk = "citedesk.cli:main"

[tool.setuptools]
packages = ["citedesk"]

[tool.setuptools.package-data]
citedesk = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # newer Starlette nudges TestClient users towards httpx2; harmless for these tests
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM108",  # explicit if/else reads better than long ternaries here
    "SIM905",  # a whitespace-separated word list is easier to read than a list literal
]

[tool.ruff.lint.per-file-ignores]
"citedesk/server.py" = ["B008"]  # FastAPI's Depends()/Header() defaults are the framework idiom
